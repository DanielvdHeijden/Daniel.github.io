<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Daniel</title>

  <link rel="stylesheet" href="css/style.css">
  <script src="js/global.js" defer></script>
</head>

<body>

  <main>
    <div class="container">
      <div class="foto-banner">
        <img src="img/shopmonkey-banner.webp" alt="shopmonkey" class="main-banner">
      </div>
      
      <div class="sub-banners">
        
        <div class="sub-banner">
          
          <div class="logo-card logo-card-1">
            <img src="img/logo1.png" alt="Vida Design" class="sub-banner-image">
          </div>

          <div class="logo-card logo-card-2">
            <img src="img/logo2.jpg" alt="Gabberwear" class="sub-banner-image">
          </div>

          <div class="logo-card logo-card-3">
            <img src="img/logo3.png" alt="Webshop project" class="sub-banner-image">
          </div>
          
        </div>
        <div class="sub-banner sub-banner-2">
          <img src="img/portret.jpeg" alt="over mij" class="sub-banner-image portret">
        </div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

</html>
